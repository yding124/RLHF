<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Preference reward model training and validation loss</title>
  <desc id="desc">Training loss falls sharply in epoch two while validation loss reaches its minimum near optimizer step 100 and then rises.</desc>
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="48" y="34" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#172033">Bradley–Terry loss</text>
  <g stroke="#d8dee9" stroke-width="1">
    <line x1="90" y1="80" x2="910" y2="80"/><line x1="90" y1="167.5" x2="910" y2="167.5"/>
    <line x1="90" y1="255" x2="910" y2="255"/><line x1="90" y1="342.5" x2="910" y2="342.5"/><line x1="90" y1="430" x2="910" y2="430"/>
  </g>
  <rect x="90" y="80" width="820" height="350" fill="none" stroke="#8b95a7"/>
  <g font-family="system-ui, sans-serif" font-size="13" fill="#465166">
    <text x="76" y="85" text-anchor="end">1.00</text><text x="76" y="172.5" text-anchor="end">0.75</text>
    <text x="76" y="260" text-anchor="end">0.50</text><text x="76" y="347.5" text-anchor="end">0.25</text><text x="76" y="435" text-anchor="end">0.00</text>
    <text x="90" y="455" text-anchor="middle">0</text><text x="285.6" y="455" text-anchor="middle">125</text>
    <text x="481.2" y="455" text-anchor="middle">250</text><text x="676.8" y="455" text-anchor="middle">375</text><text x="872.4" y="455" text-anchor="middle">500</text>
    <text x="500" y="493" text-anchor="middle" font-size="15">Optimizer step</text>
    <text transform="translate(24 255) rotate(-90)" text-anchor="middle" font-size="15">Loss</text>
  </g>
  <line x1="90" y1="187.4" x2="910" y2="187.4" stroke="#7d8798" stroke-dasharray="6 6"/>
  <text x="900" y="180" text-anchor="end" font-family="system-ui, sans-serif" font-size="12" fill="#5d6778">neutral loss ln(2) = 0.693</text>
  <line x1="500.7" y1="80" x2="500.7" y2="430" stroke="#30394a" stroke-dasharray="3 7"/>
  <text x="508" y="99" font-family="system-ui, sans-serif" font-size="12" fill="#30394a">epoch 2</text>
  <polyline points="97.8,178.6 168.2,232.3 246.5,226.2 324.7,230.0 403.0,231.8 481.2,255.1 496.9,247.8 520.3,346.8 559.5,329.6 637.7,358.0 716.0,282.8 794.2,388.2 872.4,372.0 910.0,305.2" fill="none" stroke="#2563eb" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline points="129.1,118.7 168.2,207.2 207.4,260.0 246.5,269.6 285.6,264.8 324.7,265.9 363.9,267.0 403.0,268.5 442.1,265.1 481.2,265.6 520.3,253.2 559.5,261.9 598.6,241.2 637.7,228.4 676.8,214.1 716.0,228.8 755.1,221.9 794.2,200.2 833.3,201.2 872.4,220.3" fill="none" stroke="#e76f51" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <g fill="#e76f51" stroke="#ffffff" stroke-width="2">
    <circle cx="129.1" cy="118.7" r="4"/><circle cx="168.2" cy="207.2" r="4"/><circle cx="207.4" cy="260.0" r="4"/><circle cx="246.5" cy="269.6" r="5"/><circle cx="285.6" cy="264.8" r="4"/><circle cx="324.7" cy="265.9" r="4"/><circle cx="363.9" cy="267.0" r="4"/><circle cx="403.0" cy="268.5" r="4"/><circle cx="442.1" cy="265.1" r="4"/><circle cx="481.2" cy="265.6" r="4"/><circle cx="520.3" cy="253.2" r="4"/><circle cx="559.5" cy="261.9" r="4"/><circle cx="598.6" cy="241.2" r="4"/><circle cx="637.7" cy="228.4" r="4"/><circle cx="676.8" cy="214.1" r="4"/><circle cx="716.0" cy="228.8" r="4"/><circle cx="755.1" cy="221.9" r="4"/><circle cx="794.2" cy="200.2" r="4"/><circle cx="833.3" cy="201.2" r="4"/><circle cx="872.4" cy="220.3" r="4"/>
  </g>
  <path d="M246.5 269.6 L270 298" fill="none" stroke="#30394a"/>
  <text x="276" y="303" font-family="system-ui, sans-serif" font-size="13" fill="#30394a">best validation loss: 0.458 at step 100</text>
  <g font-family="system-ui, sans-serif" font-size="13" fill="#30394a">
    <line x1="660" y1="35" x2="694" y2="35" stroke="#2563eb" stroke-width="4"/><text x="702" y="40">Train, sampled 5-step means</text>
    <line x1="660" y1="57" x2="694" y2="57" stroke="#e76f51" stroke-width="4"/><text x="702" y="62">Validation</text>
  </g>
</svg>
