<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Preference reward model pairwise training and validation accuracy</title>
  <desc id="desc">Training accuracy approaches the mid nineties in epoch two while validation accuracy peaks at 78.9 percent near optimizer step 175.</desc>
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="48" y="34" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#172033">Pairwise accuracy—not ROC-AUC</text>
  <g stroke="#d8dee9" stroke-width="1">
    <line x1="90" y1="80" x2="910" y2="80"/><line x1="90" y1="138.3" x2="910" y2="138.3"/><line x1="90" y1="196.7" x2="910" y2="196.7"/>
    <line x1="90" y1="255" x2="910" y2="255"/><line x1="90" y1="313.3" x2="910" y2="313.3"/><line x1="90" y1="371.7" x2="910" y2="371.7"/><line x1="90" y1="430" x2="910" y2="430"/>
  </g>
  <rect x="90" y="80" width="820" height="350" fill="none" stroke="#8b95a7"/>
  <g font-family="system-ui, sans-serif" font-size="13" fill="#465166">
    <text x="76" y="85" text-anchor="end">100%</text><text x="76" y="143.3" text-anchor="end">90%</text><text x="76" y="201.7" text-anchor="end">80%</text>
    <text x="76" y="260" text-anchor="end">70%</text><text x="76" y="318.3" text-anchor="end">60%</text><text x="76" y="376.7" text-anchor="end">50%</text><text x="76" y="435" text-anchor="end">40%</text>
    <text x="90" y="455" text-anchor="middle">0</text><text x="285.6" y="455" text-anchor="middle">125</text><text x="481.2" y="455" text-anchor="middle">250</text>
    <text x="676.8" y="455" text-anchor="middle">375</text><text x="872.4" y="455" text-anchor="middle">500</text>
    <text x="500" y="493" text-anchor="middle" font-size="15">Optimizer step</text>
    <text transform="translate(24 255) rotate(-90)" text-anchor="middle" font-size="15">Pairwise accuracy</text>
  </g>
  <line x1="90" y1="371.7" x2="910" y2="371.7" stroke="#7d8798" stroke-dasharray="6 6"/>
  <text x="900" y="364" text-anchor="end" font-family="system-ui, sans-serif" font-size="12" fill="#5d6778">chance = 50%</text>
  <line x1="500.7" y1="80" x2="500.7" y2="430" stroke="#30394a" stroke-dasharray="3 7"/>
  <text x="508" y="99" font-family="system-ui, sans-serif" font-size="12" fill="#30394a">epoch 2</text>
  <polyline points="97.8,305.9 168.2,233.2 246.5,240.4 324.7,247.8 403.0,233.1 481.2,240.4 496.9,189.4 520.3,138.1 559.5,123.6 637.7,131.0 716.0,152.8 794.2,109.1 872.4,108.9 910.0,149.9" fill="none" stroke="#2563eb" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline points="129.1,312.2 168.2,240.4 207.4,216.5 246.5,215.3 285.6,218.2 324.7,229.3 363.9,203.1 403.0,204.2 442.1,228.2 481.2,214.2 520.3,205.4 559.5,229.3 598.6,227.0 637.7,219.4 676.8,211.8 716.0,227.0 755.1,207.8 794.2,211.8 833.3,209.5 872.4,219.4" fill="none" stroke="#e76f51" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <g fill="#e76f51" stroke="#ffffff" stroke-width="2">
    <circle cx="129.1" cy="312.2" r="4"/><circle cx="168.2" cy="240.4" r="4"/><circle cx="207.4" cy="216.5" r="4"/><circle cx="246.5" cy="215.3" r="4"/><circle cx="285.6" cy="218.2" r="4"/><circle cx="324.7" cy="229.3" r="4"/><circle cx="363.9" cy="203.1" r="5"/><circle cx="403.0" cy="204.2" r="4"/><circle cx="442.1" cy="228.2" r="4"/><circle cx="481.2" cy="214.2" r="4"/><circle cx="520.3" cy="205.4" r="4"/><circle cx="559.5" cy="229.3" r="4"/><circle cx="598.6" cy="227.0" r="4"/><circle cx="637.7" cy="219.4" r="4"/><circle cx="676.8" cy="211.8" r="4"/><circle cx="716.0" cy="227.0" r="4"/><circle cx="755.1" cy="207.8" r="4"/><circle cx="794.2" cy="211.8" r="4"/><circle cx="833.3" cy="209.5" r="4"/><circle cx="872.4" cy="219.4" r="4"/>
  </g>
  <path d="M363.9 203.1 L392 174" fill="none" stroke="#30394a"/>
  <text x="398" y="171" font-family="system-ui, sans-serif" font-size="13" fill="#30394a">best validation accuracy: 78.9% at step 175</text>
  <g font-family="system-ui, sans-serif" font-size="13" fill="#30394a">
    <line x1="660" y1="35" x2="694" y2="35" stroke="#2563eb" stroke-width="4"/><text x="702" y="40">Train, sampled 5-step means</text>
    <line x1="660" y1="57" x2="694" y2="57" stroke="#e76f51" stroke-width="4"/><text x="702" y="62">Validation</text>
  </g>
</svg>
