  &lt;/style&gt;
  &lt;div class=&quot;title&quot;&gt;Reward-model training: preference, outcome, and process supervision&lt;/div&gt;
  &lt;div class=&quot;subtitle&quot;&gt;All three models use the prompt as context. They differ in the labels, hidden states scored, and loss.&lt;/div&gt;

  &lt;div class=&quot;section-title&quot;&gt;One worked example per reward model&lt;/div&gt;
  &lt;div class=&quot;model-grid&quot;&gt;
    &lt;article class=&quot;model&quot;&gt;
      &lt;h3&gt;Preference RM&lt;/h3&gt;
      &lt;p&gt;&lt;b&gt;Sample:&lt;/b&gt; prompt “What is 3+2?”, chosen “5”, rejected “6”.&lt;/p&gt;
      &lt;div class=&quot;flow&quot;&gt;[prompt + chosen + EOS] → hᶜfinal → rᶜ
[prompt + rejected + EOS] → hʳfinal → rʳ
loss = −log σ(rᶜ − rʳ)&lt;/div&gt;
      &lt;p&gt;If &lt;code&gt;rᶜ=1.2&lt;/code&gt; and &lt;code&gt;rʳ=−0.3&lt;/code&gt;, margin = 1.5, preference probability = 0.818, loss = 0.201.&lt;/p&gt;
      &lt;p class=&quot;muted&quot;&gt;Two separate forward passes through the same model; only the final real-token hidden state is directly scored.&lt;/p&gt;
    &lt;/article&gt;
    &lt;article class=&quot;model&quot;&gt;
      &lt;h3&gt;Outcome RM (ORM)&lt;/h3&gt;
      &lt;p&gt;&lt;b&gt;Sample:&lt;/b&gt; prompt “What is 3+2?”, response “5”, outcome &lt;code&gt;1&lt;/code&gt;. No pair is required.&lt;/p&gt;
      &lt;div class=&quot;flow&quot;&gt;tokens: [prompt | response | EOS]
labels: [ −100  |  1 1 …   |  1 ]
hresponse,t → scalar logit zₜ
loss = mean BCEWithLogits(zₜ, outcome)&lt;/div&gt;
      &lt;p&gt;The final pass/fail label is repeated at every completion position; the repository uses the final-token probability for evaluation.&lt;/p&gt;
      &lt;p class=&quot;muted&quot;&gt;Prompt tokens remain visible through attention; &lt;code&gt;−100&lt;/code&gt; only excludes them from direct loss.&lt;/p&gt;
    &lt;/article&gt;
    &lt;article class=&quot;model&quot;&gt;
      &lt;h3&gt;Process RM (PRM)&lt;/h3&gt;
      &lt;p&gt;&lt;b&gt;Sample:&lt;/b&gt; “rewrite as repeated addition” positive; “this is arithmetic” neutral; “sum is 35” negative.&lt;/p&gt;
      &lt;div class=&quot;flow&quot;&gt;[prompt | step₁ | END | step₂ | END | step₃ | END]
labels: [  −100 …  +1 |  −100 …  0 |  −100 … −1 ]
hstep-end → 3-class logits
loss = mean cross-entropy at step boundaries&lt;/div&gt;
      &lt;p class=&quot;muted&quot;&gt;Positive/neutral/negative follows PRM800K; three classes are common, not required. Binary and generative PRMs also exist.&lt;/p&gt;
    &lt;/article&gt;
  &lt;/div&gt;

  &lt;div class=&quot;section-title&quot;&gt;What changes across model types&lt;/div&gt;
  &lt;table&gt;
    &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Model&lt;/th&gt;&lt;th&gt;Training record&lt;/th&gt;&lt;th&gt;Directly scored states&lt;/th&gt;&lt;th&gt;Meaning learned&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
    &lt;tbody&gt;
      &lt;tr&gt;&lt;td&gt;Preference RM&lt;/td&gt;&lt;td&gt;&lt;code&gt;(prompt, chosen, rejected)&lt;/code&gt;&lt;/td&gt;&lt;td&gt;Final chosen and rejected states&lt;/td&gt;&lt;td&gt;Which complete response is preferred?&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;ORM&lt;/td&gt;&lt;td&gt;&lt;code&gt;(prompt, response, pass/fail)&lt;/code&gt;&lt;/td&gt;&lt;td&gt;All completion states in this implementation&lt;/td&gt;&lt;td&gt;Will the response ultimately be correct?&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;PRM&lt;/td&gt;&lt;td&gt;&lt;code&gt;(prompt, steps, step labels)&lt;/code&gt;&lt;/td&gt;&lt;td&gt;Reasoning-step boundary states&lt;/td&gt;&lt;td&gt;Is each step valid/useful in context?&lt;/td&gt;&lt;/tr&gt;
    &lt;/tbody&gt;
  &lt;/table&gt;

  &lt;div class=&quot;section-title&quot;&gt;Masks, EOS, and optimization&lt;/div&gt;
  &lt;table&gt;
    &lt;tbody&gt;
      &lt;tr&gt;&lt;th&gt;Attention mask&lt;/th&gt;&lt;td&gt;Prompt + response = &lt;code&gt;1&lt;/code&gt;; padding = &lt;code&gt;0&lt;/code&gt;. It controls model context.&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;th&gt;Loss mask&lt;/th&gt;&lt;td&gt;ORM/PRM use label &lt;code&gt;−100&lt;/code&gt; where no direct loss is applied. Those prompt tokens still influence later hidden states.&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;th&gt;EOS&lt;/th&gt;&lt;td&gt;Convenient but not mathematically required. A final real token, special reward token, or pooled representation can summarize the sequence.&lt;/td&gt;&lt;/tr&gt;
    &lt;/tbody&gt;
  &lt;/table&gt;
  &lt;div class=&quot;batch-note&quot;&gt;&lt;b&gt;Why the effective batch size is 16:&lt;/b&gt; &lt;code&gt;microbatch_size=2&lt;/code&gt; preference pairs × &lt;code&gt;gradient_accumulation_steps=8&lt;/code&gt; = &lt;code&gt;16 pairs&lt;/code&gt; per optimizer update. Each pair contains a chosen and rejected sequence, so one update processes 32 sequences through the shared model.&lt;/div&gt;
  &lt;div class=&quot;accum-grid&quot; aria-label=&quot;Eight microbatches of two preference pairs each&quot;&gt;
    &lt;div class=&quot;microbatch&quot;&gt;&lt;b&gt;Microbatch 1&lt;/b&gt;&lt;span&gt;pairs 1–2&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;microbatch&quot;&gt;&lt;b&gt;Microbatch 2&lt;/b&gt;&lt;span&gt;pairs 3–4&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;microbatch&quot;&gt;&lt;b&gt;Microbatch 3&lt;/b&gt;&lt;span&gt;pairs 5–6&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;microbatch&quot;&gt;&lt;b&gt;Microbatch 4&lt;/b&gt;&lt;span&gt;pairs 7–8&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;microbatch&quot;&gt;&lt;b&gt;Microbatch 5&lt;/b&gt;&lt;span&gt;pairs 9–10&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;microbatch&quot;&gt;&lt;b&gt;Microbatch 6&lt;/b&gt;&lt;span&gt;pairs 11–12&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;microbatch&quot;&gt;&lt;b&gt;Microbatch 7&lt;/b&gt;&lt;span&gt;pairs 13–14&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;microbatch&quot;&gt;&lt;b&gt;Microbatch 8&lt;/b&gt;&lt;span&gt;pairs 15–16&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;equations&quot;&gt;
    &lt;div class=&quot;equation&quot;&gt;&lt;b&gt;1 · Pair losses&lt;/b&gt;&lt;code&gt;ℓᵢ = −log σ(rᶜᵢ − rʳᵢ)&lt;/code&gt;One loss for each chosen/rejected pair.&lt;/div&gt;
    &lt;div class=&quot;equation&quot;&gt;&lt;b&gt;2 · Inside microbatch j&lt;/b&gt;&lt;code&gt;Lⱼ = (ℓ₂ⱼ₋₁ + ℓ₂ⱼ) / 2&lt;/code&gt;The two pair losses are averaged before backward.&lt;/div&gt;
    &lt;div class=&quot;equation&quot;&gt;&lt;b&gt;3 · Accumulate gradients&lt;/b&gt;&lt;code&gt;G ← G + (1/8)∇Lⱼ&lt;/code&gt;&lt;code&gt;backward()&lt;/code&gt; adds into one gradient buffer per parameter; it does not store eight separate gradients. Model weights stay unchanged.&lt;/div&gt;
    &lt;div class=&quot;equation&quot;&gt;&lt;b&gt;4 · Update after j = 8&lt;/b&gt;&lt;code&gt;G = ∇[(1/16) Σᵢ₌₁¹⁶ ℓᵢ]&lt;/code&gt;AdamW uses this averaged gradient once, then gradients are cleared with &lt;code&gt;zero_grad()&lt;/code&gt;.&lt;/div&gt;
  &lt;/div&gt;
